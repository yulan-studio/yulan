<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f2eb" />
  <title>留白 · 句子收藏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f2eb;--ink:#24221e;--muted:#7f796d;--line:#ddd8cd;--accent:#c96342;--card:#fbfaf7;--shadow:0 16px 42px rgba(67,58,43,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif} button,input,textarea{font:inherit} button{cursor:pointer}
    .shell{max-width:1220px;margin:0 auto;padding:34px 28px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px}.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:'DM Mono';font-size:12px}.brand h1{font-size:17px;letter-spacing:.16em;margin:0;font-weight:600}.brand span{color:var(--muted);font-size:12px;letter-spacing:.08em}.top-note{font-family:'DM Mono';font-size:11px;color:var(--muted);letter-spacing:.08em}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:76px;align-items:end;margin-bottom:70px}.eyebrow{font-family:'DM Mono';color:var(--accent);font-size:11px;letter-spacing:.13em;margin-bottom:19px}.hero h2{font-size:clamp(39px,5vw,68px);line-height:1.17;font-weight:500;letter-spacing:-.05em;margin:0 0 22px;max-width:640px}.hero h2 em{font-style:normal;color:var(--accent)}.hero p{font-size:16px;line-height:2;color:var(--muted);max-width:465px;margin:0}.statline{border-top:1px solid var(--line);padding-top:18px;display:flex;gap:44px;color:var(--muted)}.stat strong{display:block;color:var(--ink);font-size:27px;font-weight:500;margin-bottom:4px}.stat small{font-family:'DM Mono';font-size:10px;letter-spacing:.1em}
    .workspace{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}.panel,.quote-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.panel{padding:25px;border-radius:3px;position:sticky;top:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.panel h3{font-size:18px;margin:0;font-weight:600}.step{font-family:'DM Mono';font-size:10px;color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:18px 0 8px}textarea,input{width:100%;border:1px solid var(--line);background:#fffdfa;color:var(--ink);outline:none;border-radius:2px;padding:12px 13px}textarea{height:150px;resize:vertical;line-height:1.8;font-size:16px}input{font-size:13px}textarea:focus,input:focus{border-color:var(--accent)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.toolbar button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 4px;font-size:12px}.toolbar button.active{background:var(--ink);border-color:var(--ink);color:#fff}.aligns{display:flex;gap:8px;margin-top:9px}.aligns button{width:36px}.color-row{display:flex;gap:10px;align-items:center}.swatch{height:24px;width:24px;border-radius:50%;border:2px solid var(--card);outline:1px solid var(--line);padding:0}.swatch.active{outline:2px solid var(--accent)}.publish{margin-top:24px;width:100%;border:0;background:var(--accent);color:white;padding:13px;font-size:13px;letter-spacing:.08em}.publish:hover{background:#ad4e32}.hint{font-size:11px;color:var(--muted);line-height:1.8;margin:14px 0 0}
    .feed-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:3px 0 17px;margin-bottom:18px}.feed-head h3{font-size:17px;margin:0;font-weight:600}.feed-actions{display:flex;gap:8px;align-items:center}.search{width:190px;padding:9px 12px;font-size:12px}.sort{border:0;background:transparent;color:var(--muted);font-size:12px}.feed{display:grid;gap:14px}.quote-card{padding:25px 27px 22px;position:relative}.quote-card:before{content:'“';position:absolute;top:13px;left:14px;color:#ded8ca;font-size:48px;line-height:1}.quote{font-size:19px;line-height:1.9;margin:8px 0 20px;white-space:pre-wrap}.meta{border-top:1px solid #e9e5dd;padding-top:13px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.meta .source{color:var(--ink)}.tag{font-family:'DM Mono';font-size:10px;color:var(--accent);border:1px solid #e8c6ba;padding:4px 7px}.empty{text-align:center;color:var(--muted);padding:70px 20px;border:1px dashed var(--line);font-size:14px;line-height:2}.delete{position:absolute;right:18px;top:17px;border:0;background:transparent;color:#b8b0a2;font-size:15px;opacity:0}.quote-card:hover .delete{opacity:1}.delete:hover{color:var(--accent)}
    @media(max-width:820px){.shell{padding:24px 18px 50px}.topbar{margin-bottom:42px}.top-note{display:none}.hero{grid-template-columns:1fr;gap:28px;margin-bottom:42px}.hero h2{font-size:42px}.workspace{grid-template-columns:1fr}.panel{position:static}.feed-head{align-items:flex-start;gap:12px;flex-direction:column}.feed-actions{width:100%}.search{flex:1;width:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="mark">留</div><h1>留白</h1><span>句子收藏</span></div><div class="top-note">FOR THE WORDS WORTH RETURNING TO</div></header>
    <section class="hero"><div><div class="eyebrow">A SMALL PLACE FOR BIG THOUGHTS</div><h2>把值得回来的话，<em>留下来。</em></h2><p>从书里、对话里、路上偶然听见的句子。给它们一个安静的位置，等下一次想起。</p></div><div class="statline"><div class="stat"><strong id="count">0</strong><small>已收藏</small></div><div class="stat"><strong id="tagCount">0</strong><small>主题</small></div><div class="stat"><strong>∞</strong><small>回味</small></div></div></section>
    <section class="workspace"><aside class="panel"><div class="panel-head"><h3>留下此刻</h3><span class="step">01 / 01</span></div><label for="quoteInput">句子</label><textarea id="quoteInput" placeholder="写下让你停留了一会儿的话……"></textarea><label for="sourceInput">出处 / 作者 <span>(可选)</span></label><input id="sourceInput" placeholder="例如：书名 · 作者 / 朋友说"/><label for="tagInput">给它一个主题 <span>(可选)</span></label><input id="tagInput" placeholder="例如：勇气、时间、生活"/><label>文字样式</label><div class="toolbar" id="weight"><button data-value="400" class="active">轻一点</button><button data-value="600">重一点</button></div><div class="toolbar" id="size"><button data-value="16" class="active">小</button><button data-value="20">大</button></div><div class="aligns" id="align"><button data-value="left" class="active">左</button><button data-value="center">中</button><button data-value="right">右</button><div class="color-row"><button class="swatch active" data-color="#24221e" style="background:#24221e"></button><button class="swatch" data-color="#c96342" style="background:#c96342"></button><button class="swatch" data-color="#49645c" style="background:#49645c"></button></div></div><button class="publish" id="publish">收藏这句话　→</button><p class="hint">所有内容会保存在当前浏览器里。你可以随时回来修改自己的收藏习惯。</p></aside><div><div class="feed-head"><h3>我的句子 <span id="feedCount" style="color:var(--muted);font-size:12px;font-weight:400">· 0</span></h3><div class="feed-actions"><input class="search" id="search" placeholder="搜索句子或主题"/><button class="sort" id="sort">最新在前 ↕</button></div></div><div class="feed" id="feed"></div></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const seed=[{text:'真正重要的东西，往往不是立刻让你开心，而是让你变得更自由。',source:'写给自己的提醒',tag:'自由',weight:'400',size:'20',align:'left',color:'#24221e',date:'刚刚'},{text:'慢一点没有关系，重要的是你还在朝自己想去的地方走。',source:'日常',tag:'生活',weight:'600',size:'16',align:'left',color:'#49645c',date:'昨天'}];
    let items=JSON.parse(localStorage.getItem('liubai-quotes')||'null')||seed, state={weight:'400',size:'16',align:'left',color:'#24221e'}, newest=true;
    function save(){localStorage.setItem('liubai-quotes',JSON.stringify(items));render()}
    function render(){let q=($('#search').value||'').toLowerCase();let list=items.filter(x=>(x.text+x.source+x.tag).toLowerCase().includes(q));if(!newest)list=[...list].reverse();$('#count').textContent=items.length;$('#feedCount').textContent='· '+list.length;$('#tagCount').textContent=new Set(items.map(x=>x.tag).filter(Boolean)).size;$('#feed').innerHTML=list.length?list.map((x,i)=>`<article class="quote-card"><button class="delete" data-i="${items.indexOf(x)}" aria-label="删除">×</button><div class="quote" style="font-weight:${x.weight};font-size:${x.size}px;text-align:${x.align};color:${x.color}">${esc(x.text)}</div><div class="meta"><span class="source">${esc(x.source||'无出处')}</span><span>${x.tag?`<span class="tag"># ${esc(x.tag)}</span>`:''}　${x.date}</span></div></article>`).join(''):'<div class="empty">还没有收藏。<br>从左边写下第一句，让这里慢慢长出你的生活。</div>';$$('.delete').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.i,1);save()})}
    function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function group(id,key){$$('#'+id+' button').forEach(b=>b.onclick=()=>{$$('#'+id+' button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state[key]=b.dataset.value})};group('weight','weight');group('size','size');group('align','align');$$('.swatch').forEach(b=>b.onclick=()=>{$$('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.color=b.dataset.color});
    $('#publish').onclick=()=>{let text=$('#quoteInput').value.trim();if(!text){$('#quoteInput').focus();return}items.unshift({...state,text,source:$('#sourceInput').value.trim(),tag:$('#tagInput').value.trim(),date:'刚刚'});$('#quoteInput').value='';$('#sourceInput').value='';$('#tagInput').value='';save()};$('#search').oninput=render;$('#sort').onclick=()=>{newest=!newest;$('#sort').textContent=newest?'最新在前 ↕':'最早在前 ↕';render()};render();
  </script>
</body>
</html>
